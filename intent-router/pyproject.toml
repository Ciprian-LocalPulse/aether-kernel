[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-intent-router"
version = "0.1.0a0"
description = "Aether Intent Router — NLU, planning, and multi-agent coordination for the Aether stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Ciprian Ștefan Pleșca" }
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
