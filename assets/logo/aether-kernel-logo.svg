  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DE0FF"/>
      <stop offset="55%" stop-color="#3AA8FF"/>
      <stop offset="100%" stop-color="#155FCC"/>
    </radialGradient>
    <linearGradient id="ringGradA" x1="0%" y1="0%" x2="100%" y2="100%">
